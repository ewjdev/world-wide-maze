# Production deploy (Phase 12, reworked in Phase 17). PREPARED, NOT YET RUN — inert until the repository variable
# WWM_DEPLOY_ENABLED is "true" (infra/README.md, one-time setup).
#
# Every push to `main` (i.e. every merged PR) → pnpm check → build web → migrate the production D1 →
# `wrangler deploy --env production` (Worker `wwm`: API + web app as static assets) → smoke test on the custom
# domain. The deploy job runs in the GitHub Environment `production`: add "Required reviewers" there if every
# production deploy should wait for a manual approval (optional; see infra/README.md).
# PR Previews are a separate workflow (preview.yml). There is no staging Worker any more (Phase 17).
#
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (repository or `production` environment secrets), exposed
# only to the migration and deploy steps. Worker secrets (IP_HASH_SALT, ANTHROPIC_API_KEY) are set once with
# `wrangler secret put … --env production`, never from CI. Consider pinning the actions by commit SHA.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # re-deploy the current main by hand

concurrency:
  group: deploy-production
  cancel-in-progress: false # never interrupt a deploy half-way; queue the next one

permissions:
  contents: read

jobs:
  check:
    if: vars.WWM_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wwm/fixture-capture exec playwright install --with-deps chromium
      - run: pnpm check

  production:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.names.outputs.url }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Names from infra/cloudflare.config.json
        id: names
        run: |
          echo "env=$(jq -er .wranglerEnv infra/cloudflare.config.json)" >> "$GITHUB_OUTPUT"
          echo "d1=$(jq -er .production.d1 infra/cloudflare.config.json)" >> "$GITHUB_OUTPUT"
          echo "url=https://$(jq -er .domain infra/cloudflare.config.json)" >> "$GITHUB_OUTPUT"

      - name: Build the web app (static assets)
        run: pnpm --filter @wwm/web build
        env:
          VITE_TELEMETRY_URL: ${{ vars.WWM_TELEMETRY_URL }} # empty = telemetry off

      - name: Refuse placeholder ids, dev switches, missing domain
        run: node infra/scripts/check-deploy-config.mjs production

      - name: D1 migrations (production database; must stay backward compatible)
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WENV: ${{ steps.names.outputs.env }}
          D1: ${{ steps.names.outputs.d1 }}
        run: pnpm exec wrangler d1 migrations apply "$D1" --remote --env "$WENV"

      - name: Deploy
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WENV: ${{ steps.names.outputs.env }}
          SHA: ${{ github.sha }}
        run: pnpm exec wrangler deploy --env "$WENV" --message "main $SHA"

      - name: Smoke test
        env:
          URL: ${{ steps.names.outputs.url }}
        run: node infra/scripts/smoke.mjs "$URL"
