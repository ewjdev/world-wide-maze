# Deploy (Phase 12). PREPARED, NOT YET ENABLED — nothing here has ever run.
#
# - Staging: every push to `main` → Worker `wwm-staging` (API + web app as static assets), D1 migrations first.
# - Production: a `v*` tag → Worker `wwm`, gated by the GitHub Environment `production`, which must be configured
#   with "Required reviewers" so every production deploy waits for an explicit human approval.
#
# Nothing runs until the repository variable WWM_DEPLOY_ENABLED is set to "true" (Settings → Secrets and
# variables → Actions → Variables). Before that, fill in the placeholder ids in apps/worker/wrangler.jsonc and
# follow infra/README.md ("Provisioning" and "Enabling the deploy workflow").
#
# Secrets (per GitHub Environment `staging` / `production`):
#   CLOUDFLARE_API_TOKEN   token with Workers Scripts:Edit, Workers KV:Edit, D1:Edit, R2:Edit, Account Settings:Read
#   CLOUDFLARE_ACCOUNT_ID
# The token is only exposed to the migration and deploy steps (not to `pnpm install` or the build).
# Also restrict the `production` Environment's deployment rules to `v*` tags, and consider pinning actions by SHA.
# Worker secrets (IP_HASH_SALT) are set once with `wrangler secret put`, not from CI; deployed envs refuse score
# submissions (503) while it's missing.
name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: 'staging or production'
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: vars.WWM_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wwm/fixture-capture exec playwright install --with-deps chromium
      - run: pnpm check

  staging:
    needs: check
    if: vars.WWM_DEPLOY_ENABLED == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the web app (static assets)
        run: pnpm --filter @wwm/web build
        env:
          VITE_TELEMETRY_URL: ${{ vars.WWM_TELEMETRY_URL }} # empty = telemetry off
      - name: Refuse placeholder resource ids
        run: node infra/scripts/check-deploy-config.mjs staging
      - name: D1 migrations
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply wwm-staging --remote --env staging
      - name: Deploy
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ github.sha }}
        run: pnpm exec wrangler deploy --env staging --message "staging $SHA"
      - name: Smoke test
        env:
          URL: ${{ vars.WWM_STAGING_URL }}
        run: node infra/scripts/smoke.mjs "$URL"

  production:
    needs: check
    # Production only ever deploys a `v*` tag (a manual dispatch must also be started from a tag).
    if: vars.WWM_DEPLOY_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The `production` GitHub Environment must require a reviewer: this job then waits for manual approval.
    environment:
      name: production
      url: ${{ vars.WWM_PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the web app (static assets)
        run: pnpm --filter @wwm/web build
        env:
          VITE_TELEMETRY_URL: ${{ vars.WWM_TELEMETRY_URL }}
      - name: Refuse placeholder resource ids
        run: node infra/scripts/check-deploy-config.mjs production
      - name: D1 migrations
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply wwm --remote --env production
      - name: Deploy
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REF: ${{ github.ref_name }}
        run: pnpm exec wrangler deploy --env production --message "production $REF"
      - name: Smoke test
        env:
          URL: ${{ vars.WWM_PRODUCTION_URL }}
        run: node infra/scripts/smoke.mjs "$URL"
