# The one pipeline (CI stability, Phase 17 follow-up): `pnpm check` runs exactly once per PR head and once per push
# to `main`, and everything that deploys `needs:` that single check job.
#
#   pull_request opened / synchronize / reopened → check → preview (stable URL, smoke test, sticky comment)
#   pull_request labeled static-preview          → check → assets-only preview
#   pull_request closed                          → preview-cleanup (delete the PR host)
#   push to main (every merged PR)               → check → deploy-production (D1 migrations, `wrangler deploy`, smoke)
#   workflow_dispatch on main                    → check → deploy-production (re-deploy the current main by hand)
#   workflow_dispatch on a branch + deploy_preview → check → isolated static preview (explicit opt-in)
#
# Branch pushes without a PR run nothing: open a (draft) PR to get CI. There is no second trigger on `push` for PR
# branches, so a PR push is never checked twice.
#
# Online previews need WWM_PREVIEWS_ENABLED=true. The static-preview label opts a same-repository PR into an
# assets-only review host even while online previews are disabled. Production needs WWM_DEPLOY_ENABLED=true.
# PRs from forks get no secrets and no Preview.
#
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (repository secrets; production may also use `production`
# environment secrets), exposed only to the steps that talk to Cloudflare. Worker secrets (IP_HASH_SALT,
# ANTHROPIC_API_KEY) are set once with wrangler, never from CI. Resource names come from infra/cloudflare.config.json;
# Preview settings from wrangler.jsonc. Consider pinning the actions by commit SHA.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed, labeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_preview:
        description: Deploy a static test preview from a non-main branch
        type: boolean
        default: false
      preview_name:
        description: Preview name (lowercase letters, numbers and hyphens)
        type: string
        default: manual-mobile-tilt

# One run per PR (a new push, or closing the PR, cancels the run in progress: its check result would be stale).
# On main, runs queue instead: a production deploy is never interrupted half-way.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  check:
    if: github.event.action != 'closed' && (github.event.action != 'labeled' || github.event.label.name == 'static-preview')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # build-story traceability tests check every cited commit

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # capture-script tests drive real Chromium; with CI=true they fail (not skip) if it is missing.
      - run: pnpm --filter @wwm/fixture-capture exec playwright install --with-deps chromium

      - run: pnpm check

      - name: Build and exercise the Rocket review artifact
        env:
          VITE_ROCKET_LAB_ENABLED: 'true'
        run: |
          pnpm --filter @wwm/web build
          pnpm --filter @wwm/web preview --host 127.0.0.1 --port 4173 > /tmp/wwm-rocket-preview.log 2>&1 &
          rocket_pid=$!
          trap 'kill "$rocket_pid" 2>/dev/null || true' EXIT
          for _attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/education/lessons/rocket-lab/ > /dev/null; then break; fi
            sleep 1
          done
          WWM_ROCKET_E2E_BASE=http://127.0.0.1:4173 pnpm vitest run --project @wwm/web rocket.e2e

      - name: Build standalone education pages
        run: pnpm build:education

      - name: Exercise education pages in Chromium
        run: |
          pnpm --filter @wwm/education preview > /tmp/wwm-education-preview.log 2>&1 &
          education_pid=$!
          trap 'kill "$education_pid" 2>/dev/null || true' EXIT
          for _attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4174/ > /dev/null; then break; fi
            sleep 1
          done
          WWM_EDUCATION_E2E_BASE=http://127.0.0.1:4174 pnpm vitest run --project @wwm/education education.e2e

  # PRs labeled static-preview use a dedicated assets-only Worker; other previews use the online preview config.
  preview:
    needs: check
    if: >-
      (github.event_name == 'pull_request' && github.event.action != 'closed' &&
       (vars.WWM_PREVIEWS_ENABLED == 'true' || contains(github.event.pull_request.labels.*.name, 'static-preview')) &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_preview && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # the sticky comment
    environment:
      name: ${{ github.event_name == 'pull_request' && format('preview-pr-{0}', github.event.pull_request.number) || format('preview-{0}', inputs.preview_name) }}
      url: ${{ steps.preview.outputs.url }}
    env:
      STATIC_PREVIEW: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'static-preview') }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Names from infra/cloudflare.config.json
        id: names
        env:
          PR: ${{ github.event.pull_request.number }}
          MANUAL_NAME: ${{ inputs.preview_name }}
        run: |
          echo "env=$(jq -er .wranglerEnv infra/cloudflare.config.json)" >> "$GITHUB_OUTPUT"
          if [ -n "$PR" ]; then
            echo "preview=$(jq -er .previews.namePrefix infra/cloudflare.config.json)${PR}" >> "$GITHUB_OUTPUT"
          else
            [[ "$MANUAL_NAME" =~ ^[a-z0-9][a-z0-9-]{0,39}$ ]] || { echo 'Invalid preview name'; exit 1; }
            echo "preview=$MANUAL_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the web app (static assets; telemetry off in Previews)
        run: pnpm --filter @wwm/web build
        env:
          VITE_TELEMETRY_URL: ""
          VITE_ROCKET_LAB_ENABLED: "true"
          VITE_RACE_ENABLED: "true"
          # Same-device touch play (plans/mobile-browser-game-execution.md); production sets it explicitly too.
          VITE_MOBILE_CONTROLS_ENABLED: "true"
          VITE_MOBILE_TILT_ENABLED: "true"
          VITE_PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Refuse placeholder ids / Previews bound to production data
        if: env.STATIC_PREVIEW != 'true'
        run: node infra/scripts/check-deploy-config.mjs previews

      - name: Refuse online bindings and production routing in the static host
        if: env.STATIC_PREVIEW == 'true'
        run: node infra/scripts/check-static-preview-config.mjs

      - name: D1 migrations (shared preview database)
        if: env.STATIC_PREVIEW != 'true'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc

      - name: Create or update the Preview
        id: preview
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WENV: ${{ steps.names.outputs.env }}
          NAME: ${{ steps.names.outputs.preview }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          if [ "$STATIC_PREVIEW" = 'true' ]; then
            output="$(pnpm exec wrangler deploy --config wrangler.static-preview.json --name "wwm-preview-$NAME" --var "PREVIEW_COMMIT:$SHA" --message "PR head $SHA")"
            printf '%s\n' "$output"
            url="$(printf '%s\n' "$output" | sed -nE 's/^[[:space:]]*(https:\/\/[A-Za-z0-9.-]+\.workers\.dev)[[:space:]]*$/\1/p' | tail -n 1)"
          else
            output="$(pnpm exec wrangler preview --env "$WENV" --name "$NAME" --message "PR head $SHA" --json)"
            printf '%s\n' "$output"
            # wrangler prints asset-upload progress before JSON: parse from the first line that is "{".
            url="$(printf '%s\n' "$output" | sed -n '/^{$/,$p' | jq -er '.preview.urls[0]')"
          fi
          [[ "$url" =~ ^https://[A-Za-z0-9.-]+/?$ ]] || { echo "unexpected Preview URL: $url"; exit 1; }
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        id: smoke
        env:
          URL: ${{ steps.preview.outputs.url }}
        run: node infra/scripts/smoke.mjs "$URL" --expect-static

      - name: Verify the static preview commit and Rocket lesson assets
        if: env.STATIC_PREVIEW == 'true'
        env:
          URL: ${{ steps.preview.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          curl --fail --silent "$URL/api/health" | jq -e --arg sha "$SHA" '.mode == "static" and .commit == $sha'
          curl --fail --silent "$URL/education/lessons/rocket-lab/" | grep 'data-learning-activity="rocket-lab"' > /dev/null

      - name: Preview review links
        env:
          URL: ${{ steps.preview.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf '%s\n' "## PR preview" "" \
            "- Commit: $SHA" \
            "- Rocket Lab: $URL/education/lessons/rocket-lab/" \
            "- Rocket maze: $URL/play/practice?learn=rocket-lab" \
            "- Static practice: $URL/play/practice?offline=1" >> "$GITHUB_STEP_SUMMARY"

      - name: Sticky PR comment
        if: always() && github.event_name == 'pull_request' && steps.preview.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          NAME: ${{ steps.names.outputs.preview }}
          URL: ${{ steps.preview.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          marker='<!-- wwm-worker-preview -->'
          if [ "$STATIC_PREVIEW" = 'true' ]; then
            isolation='Assets-only Worker: no D1, R2, KV, Durable Objects, AI or capture bindings. Deleted when the PR closes.'
          else
            isolation='Separate from production: preview D1/R2/KV and own Durable Objects; telemetry and paid operations off. Deleted when the PR closes.'
          fi
          body="$(printf '%s\n' "$marker" \
            "### Worker Preview \`$NAME\`" \
            "" \
            "**$URL**" \
            "" \
            "- Commit: $SHA · smoke test: **$SMOKE**" \
            "- Rocket Lab: $URL/education/lessons/rocket-lab/" \
            "- Rocket maze: $URL/play/practice?learn=rocket-lab" \
            "- Static practice: $URL/play/practice?offline=1. Dynamic APIs and phone pairing are deliberately disabled in previews to avoid separate spending allowances." \
            "- $isolation")"
          id="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\"))) | .id" | tail -n 1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi

      - name: Preview test links
        if: always() && steps.preview.outputs.url != ''
        env:
          URL: ${{ steps.preview.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          printf '%s\n' "## Mobile tilt preview" "" \
            "- Commit: $SHA; static smoke: $SMOKE" \
            "- Original: $URL/play/practice?offline=1" \
            "- Race: $URL/race/island-leap" \
            "- Mobile, tilt and Race flags explicitly enabled. Physical sensor acceptance remains open." \
            "- Dynamic APIs, phone pairing and telemetry remain disabled." >> "$GITHUB_STEP_SUMMARY"

  preview-cleanup:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      (vars.WWM_PREVIEWS_ENABLED == 'true' || contains(github.event.pull_request.labels.*.name, 'static-preview')) &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The PR's merge ref may be gone once it's closed: use the base branch's config (same Worker name).
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Delete the Preview
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ github.event.pull_request.number }}
          STATIC_PREVIEW: ${{ contains(github.event.pull_request.labels.*.name, 'static-preview') }}
        run: |
          wenv="$(jq -er .wranglerEnv ../../infra/cloudflare.config.json)"
          name="$(jq -er .previews.namePrefix ../../infra/cloudflare.config.json)${PR}"
          if [ "$STATIC_PREVIEW" = 'true' ]; then
            pnpm exec wrangler delete "wwm-preview-$name" --force
          else
            pnpm exec wrangler preview delete --env "$wenv" --name "$name" --skip-confirmation
          fi

  # ── Production (Phase 12, reworked in Phase 17): every push to `main` (i.e. every merged PR), after the check above
  # passed on that exact commit. Runs in the GitHub Environment `production`: add "Required reviewers" there if every
  # production deploy should wait for a manual approval (optional; see infra/README.md).
  deploy-production:
    needs: check
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      inputs.deploy_preview != true &&
      vars.WWM_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false # never interrupt a deploy half-way; queue the next one
    environment:
      name: production
      url: ${{ steps.names.outputs.url }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Names from infra/cloudflare.config.json
        id: names
        run: |
          {
            echo "env=$(jq -er .wranglerEnv infra/cloudflare.config.json)"
            echo "d1=$(jq -er .production.d1 infra/cloudflare.config.json)"
            echo "url=https://$(jq -er .domain infra/cloudflare.config.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Build the web app (static assets)
        run: pnpm --filter @wwm/web build
        env:
          VITE_TELEMETRY_URL: /api/t
          VITE_ROCKET_LAB_ENABLED: "false"
          # Both switches explicit (plans/mobile-browser-game-execution.md M5): same-device touch play and Race.
          # Roll back independently by setting either to "false" and redeploying.
          VITE_MOBILE_CONTROLS_ENABLED: "true"
          VITE_MOBILE_TILT_ENABLED: "false"
          VITE_RACE_ENABLED: "true"

      - name: Refuse placeholder ids, dev switches, missing domain
        run: node infra/scripts/check-deploy-config.mjs production

      - name: D1 migrations (production database; must stay backward compatible)
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WENV: ${{ steps.names.outputs.env }}
          D1: ${{ steps.names.outputs.d1 }}
        run: pnpm exec wrangler d1 migrations apply "$D1" --remote --env "$WENV"

      - name: Deploy
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WENV: ${{ steps.names.outputs.env }}
          SHA: ${{ github.sha }}
        run: pnpm exec wrangler deploy --env "$WENV" --message "main $SHA"

      - name: Smoke test
        env:
          URL: ${{ steps.names.outputs.url }}
        run: node infra/scripts/smoke.mjs "$URL"
