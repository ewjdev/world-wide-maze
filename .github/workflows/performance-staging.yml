# Staging validation only. No deployment jobs, cloud credentials, or production workflow changes.
name: Performance staging
on:
  push:
    branches: [codex/performance-p1-staging]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: performance-staging-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref == 'refs/heads/codex/performance-p1-staging'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wwm/fixture-capture exec playwright install --with-deps chromium
      # Browser correctness uses existing browser-env.ts: headless WebGL2 software fallback, no GPU timing claim.
      - run: pnpm check
      - run: pnpm docent:index --check
      - run: node --test infra/perf/p1-regression.test.mjs
      - run: node --import tsx --test infra/perf/recording-p2.test.mjs
      - name: Compare native evidence committed with staging
        shell: bash
        run: |
          node infra/perf/p1-regression.mjs docs/launch/evidence/performance-p1-staging docs/launch/evidence/performance-p2-staging /tmp/performance-comparison.json --strict-resource-plateau
      - name: Preserve comparison and native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-staging-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            /tmp/performance-comparison.json
            docs/launch/evidence/performance-p2-staging/
            docs/launch/evidence/resources-p2/
            docs/launch/evidence/controller-p2/
            docs/launch/evidence/idle-p2/
            docs/launch/evidence/render-p1/
            docs/launch/evidence/ghost-p1/
            docs/launch/evidence/performance-cache-p1/
