<title id="rockets-round-5-title">Optional: the push works in space</title>
<desc id="rockets-round-5-desc">A sideways silver-and-blue rocket floats among sparse stars with no ground. Its engine and gas plume face the blue-circle marker on the left. A yellow-triangle marker is on the right.</desc>
