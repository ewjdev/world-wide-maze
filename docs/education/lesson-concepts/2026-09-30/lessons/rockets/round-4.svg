<title id="rockets-round-4-title">A rocket uses the same idea</title>
<desc id="rockets-round-4-desc">An upright silver-and-blue rocket has a visible engine and a stylized hot-gas plume extending below it. A star sits above and a flower sits below, with no motion arrows.</desc>
