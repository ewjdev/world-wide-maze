<title id="rockets-round-3-title">A balloon tied shut</title>
<desc id="rockets-round-3-desc">An inflated teal balloon is attached to a straw on a level string. A large visible knot closes its neck. There are no air puffs. Blue-circle and yellow-triangle markers sit at opposite ends.</desc>
