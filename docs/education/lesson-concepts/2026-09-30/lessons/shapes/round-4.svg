<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-labelledby="shapes-r4-title shapes-r4-desc">
<title id="shapes-r4-title">A house roof</title><desc id="shapes-r4-desc">Three houses on separate cards. Left house has a rectangular teal roof, middle house has a curved teal roof, and right house has a triangular teal roof. The house bodies and doors match.</desc>
<style>.piece{stroke:#20262d;stroke-width:5;stroke-linejoin:miter}.card{fill:#fff;stroke:#d5dee4;stroke-width:3}</style><rect width="800" height="440" fill="#f5f7f8"/><path d="M40 390H760" stroke="#d5dee4" stroke-width="3"/>
<rect class="card" x="35" y="60" width="230" height="320" rx="18"/><rect class="card" x="285" y="60" width="230" height="320" rx="18"/><rect class="card" x="535" y="60" width="230" height="320" rx="18"/>
<g id="shapes-r4-a"><rect class="piece" x="85" y="210" width="130" height="125" fill="#fff4d1"/><rect class="piece" x="65" y="140" width="170" height="70" fill="#31a4ae"/><rect x="126" y="267" width="48" height="68" fill="#317daf"/></g>
<g id="shapes-r4-b"><rect class="piece" x="335" y="210" width="130" height="125" fill="#fff4d1"/><path class="piece" d="M315 210 Q400 70 485 210 Z" fill="#31a4ae"/><rect x="376" y="267" width="48" height="68" fill="#317daf"/></g>
<g id="shapes-r4-c"><rect class="piece" x="585" y="210" width="130" height="125" fill="#fff4d1"/><polygon class="piece" points="565,210 650,125 735,210" fill="#31a4ae"/><rect x="626" y="267" width="48" height="68" fill="#317daf"/></g>
</svg>
