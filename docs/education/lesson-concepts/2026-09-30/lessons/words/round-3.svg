<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-labelledby="words-r3-title words-r3-desc">
<title id="words-r3-title">Scoop smooth soup</title>
<desc id="words-r3-desc">Pip and a bowl of smooth orange soup above two equal choice panels: a silver fork on the left and a silver spoon on the right.</desc>
<rect width="800" height="440" rx="24" fill="#f3f7f8"/>
<g id="words-r3-pip" transform="translate(82 69)"><circle r="43" fill="#e4e8ec" stroke="#20262d" stroke-width="3"/><path d="M-24-34 Q-1-11-22 34 M23-35 Q4-4 23 35" fill="none" stroke="#317daf" stroke-width="7"/><ellipse cx="-12" cy="-3" rx="4" ry="7" fill="#20262d"/><ellipse cx="12" cy="-3" rx="4" ry="7" fill="#20262d"/><path d="M-12 14 Q0 26 12 14" fill="none" stroke="#20262d" stroke-width="3" stroke-linecap="round"/></g>
<g id="words-r3-soup" transform="translate(400 68) scale(.68)"><path d="M-91-25 Q-78 48-34 58 H34 Q78 48 91-25Z" fill="#fff" stroke="#20262d" stroke-width="4"/><ellipse cy="-25" rx="91" ry="26" fill="#fff" stroke="#20262d" stroke-width="4"/><ellipse cy="-25" rx="80" ry="18" fill="#e7a34e"/><path d="M-37-28 Q-4-36 34-26" fill="none" stroke="#f6c980" stroke-width="4"/></g>
<g id="words-r3-option-a"><title>Fork</title><rect x="60" y="145" width="320" height="270" rx="24" fill="#fff" stroke="#cdd7dc" stroke-width="3"/><g transform="translate(220 279)"><path d="M-43-99 H-29 V-42 H-16 V-99 H-3 V-42 H10 V-99 H23 V-42 H36 V-99 H49 V-29 Q49 0 13 10 L15 96 Q15 113 3 113 Q-9 113-9 96 L-7 10 Q-43 0-43-29Z" fill="#c6d2db" stroke="#20262d" stroke-width="4" stroke-linejoin="round"/></g></g>
<g id="words-r3-option-b"><title>Spoon</title><rect x="420" y="145" width="320" height="270" rx="24" fill="#fff" stroke="#cdd7dc" stroke-width="3"/><g transform="translate(580 279)"><path d="M-9-8 L-12 96 Q-12 113 0 113 Q12 113 12 96 L9-8Z" fill="#b9c6cf" stroke="#20262d" stroke-width="4"/><ellipse cy="-43" rx="41" ry="57" fill="#dfe7ed" stroke="#20262d" stroke-width="4"/><ellipse cy="-48" rx="29" ry="42" fill="#9aaeba"/><path d="M-18-68 Q-30-43-16-20" fill="none" stroke="#f4f8fa" stroke-width="5" stroke-linecap="round"/></g></g>
