<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-labelledby="letters-r4-title letters-r4-desc">
<title id="letters-r4-title">Alphabet Post Office: Another printed M</title>
<desc id="letters-r4-desc">A serif M printed on an envelope above three mailboxes showing plain A, M, and N. The choices are shown without a selected answer.</desc>
<rect width="800" height="440" fill="#f5f8f9"/>
<path d="M 0 395 H 800" fill="none" stroke="#d7e2e5" stroke-width="4"/>
<g id="letters-r4-envelope"><rect x="300" y="22" width="200" height="126" rx="12" fill="#ffffff" stroke="#b9c7cd" stroke-width="3"/><path d="M 305 27 L 400 65 L 495 27" fill="none" stroke="#b9c7cd" stroke-width="3"/><text x="400" y="129" text-anchor="middle" font-family="Times New Roman, Georgia, serif" font-size="86" font-weight="700" fill="#20262d">M</text></g>
<g id="letters-r4-choice-a"><path d="M 82 346 V 245 Q 82 179 160 179 Q 238 179 238 245 V 346 Z" fill="#317daf" stroke="#20262d" stroke-width="4"/><rect x="100" y="207" width="120" height="13" rx="5" fill="#20262d"/><rect x="96" y="235" width="128" height="96" rx="10" fill="#ffffff"/><text x="160" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="700" fill="#20262d">A</text><rect x="146" y="348" width="28" height="45" rx="3" fill="#317daf"/></g>
<g id="letters-r4-choice-b"><path d="M 322 346 V 245 Q 322 179 400 179 Q 478 179 478 245 V 346 Z" fill="#317daf" stroke="#20262d" stroke-width="4"/><rect x="340" y="207" width="120" height="13" rx="5" fill="#20262d"/><rect x="336" y="235" width="128" height="96" rx="10" fill="#ffffff"/><text x="400" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="700" fill="#20262d">M</text><rect x="386" y="348" width="28" height="45" rx="3" fill="#317daf"/></g>
<g id="letters-r4-choice-c"><path d="M 562 346 V 245 Q 562 179 640 179 Q 718 179 718 245 V 346 Z" fill="#317daf" stroke="#20262d" stroke-width="4"/><rect x="580" y="207" width="120" height="13" rx="5" fill="#20262d"/><rect x="576" y="235" width="128" height="96" rx="10" fill="#ffffff"/><text x="640" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="700" fill="#20262d">N</text><rect x="626" y="348" width="28" height="45" rx="3" fill="#317daf"/></g>
<g id="letters-r4-pip" transform="translate(44 397) scale(0.75)"><circle r="38" fill="#d2d8dd" stroke="#75818b" stroke-width="3"/><path d="M -17 -34 Q 5 0 -17 34 M 19 -33 Q 37 0 19 33" fill="none" stroke="#317daf" stroke-width="5"/><ellipse cx="-10" cy="-6" rx="4" ry="6" fill="#20262d"/><ellipse cx="10" cy="-6" rx="4" ry="6" fill="#20262d"/><path d="M -9 9 Q 0 21 9 9" fill="none" stroke="#20262d" stroke-width="3" stroke-linecap="round"/></g>
</svg>
