<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-labelledby="letters-r1-title letters-r1-desc">
<title id="letters-r1-title">Alphabet Post Office: Meet M</title>
<desc id="letters-r1-desc">An envelope marked with a large M above two mailboxes marked M and S. The choices are shown without a selected answer.</desc>
<rect width="800" height="440" fill="#f5f8f9"/>
<path d="M 0 395 H 800" fill="none" stroke="#d7e2e5" stroke-width="4"/>
<g id="letters-r1-envelope"><rect x="300" y="22" width="200" height="126" rx="12" fill="#ffffff" stroke="#b9c7cd" stroke-width="3"/><path d="M 305 27 L 400 65 L 495 27" fill="none" stroke="#b9c7cd" stroke-width="3"/><text x="400" y="129" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="700" fill="#20262d">M</text></g>
<g id="letters-r1-choice-a"><path d="M 182 346 V 245 Q 182 179 260 179 Q 338 179 338 245 V 346 Z" fill="#317daf" stroke="#20262d" stroke-width="4"/><rect x="200" y="207" width="120" height="13" rx="5" fill="#20262d"/><rect x="196" y="235" width="128" height="96" rx="10" fill="#ffffff"/><text x="260" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="700" fill="#20262d">M</text><rect x="246" y="348" width="28" height="45" rx="3" fill="#317daf"/></g>
<g id="letters-r1-choice-b"><path d="M 462 346 V 245 Q 462 179 540 179 Q 618 179 618 245 V 346 Z" fill="#317daf" stroke="#20262d" stroke-width="4"/><rect x="480" y="207" width="120" height="13" rx="5" fill="#20262d"/><rect x="476" y="235" width="128" height="96" rx="10" fill="#ffffff"/><text x="540" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="700" fill="#20262d">S</text><rect x="526" y="348" width="28" height="45" rx="3" fill="#317daf"/></g>
<g id="letters-r1-pip" transform="translate(44 397) scale(0.75)"><circle r="38" fill="#d2d8dd" stroke="#75818b" stroke-width="3"/><path d="M -17 -34 Q 5 0 -17 34 M 19 -33 Q 37 0 19 33" fill="none" stroke="#317daf" stroke-width="5"/><ellipse cx="-10" cy="-6" rx="4" ry="6" fill="#20262d"/><ellipse cx="10" cy="-6" rx="4" ry="6" fill="#20262d"/><path d="M -9 9 Q 0 21 9 9" fill="none" stroke="#20262d" stroke-width="3" stroke-linecap="round"/></g>
