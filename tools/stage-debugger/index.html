<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WWM stage debugger</title>
    <style>
      :root { color-scheme: dark; font: 13px/1.4 system-ui, sans-serif; }
      body { margin: 0; display: grid; grid-template-columns: 330px 1fr; height: 100vh; background: #0b1620; color: #dde6ee; }
      #panel { overflow: auto; padding: 10px 12px; border-right: 1px solid #1d3242; }
      #view { overflow: auto; padding: 12px; position: relative; }
      body.shot { display: block; background: #0d2a3a; }
      body.shot #panel { display: none; }
      body.shot #view { overflow: visible; padding: 0; }
      h1 { font-size: 15px; margin: 0 0 8px; }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: #8fb3c9; margin: 14px 0 6px; }
      label { display: block; }
      select, input[type='number'] { width: 100%; box-sizing: border-box; background: #13222e; color: inherit; border: 1px solid #2a4254; padding: 3px; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .layers label { display: inline-flex; gap: 4px; width: 49%; }
      .param { display: grid; grid-template-columns: 130px 1fr 44px; gap: 4px; align-items: center; font-size: 11px; }
      .param input[type='range'] { width: 100%; }
      table { border-collapse: collapse; font-size: 11px; width: 100%; }
      td, th { border-bottom: 1px solid #1d3242; padding: 2px 3px; text-align: left; vertical-align: top; }
      th { color: #8fb3c9; font-weight: 600; }
      #status { font-size: 11px; color: #9fc; white-space: pre-wrap; }
      #status.err { color: #f88; }
      #hover { font-size: 11px; white-space: pre-wrap; max-height: 220px; overflow: auto; }
      canvas { display: block; image-rendering: auto; }
      button { background: #1f3a4d; color: inherit; border: 1px solid #2f5670; padding: 4px 8px; cursor: pointer; }
    </style>
  </head>
  <body>
    <aside id="panel">
      <h1>WWM stage debugger</h1>
      <label>Source <select id="fixture"></select></label>
      <div class="row">
        <label>Slice <select id="slice"></select></label>
        <label>Difficulty
          <select id="difficulty"><option>easy</option><option selected>normal</option><option>hard</option></select>
        </label>
      </div>
      <div class="row">
        <label>Seed <input id="seed" type="number" value="1" min="0" /></label>
        <label>Zoom <select id="zoom"><option>0.5</option><option selected>0.75</option><option>1</option><option>1.5</option></select></label>
      </div>
      <p><button type="button" id="reroll">seed +1</button> <button type="button" id="reset">reset params</button></p>
      <div id="status"></div>
      <h2>Layers</h2>
      <div class="layers" id="layers"></div>
      <h2>Hover</h2>
      <div id="hover">Hover an island to see its source elements.</div>
      <h2>Stats vs 2013 AID-DCC</h2>
      <table id="stats"></table>
      <h2>Timings (ms)</h2>
      <table id="timings"></table>
      <h2>Provenance notes</h2>
      <div id="notes" style="font-size: 11px"></div>
      <h2>Parameters</h2>
      <div id="params"></div>
    </aside>
    <main id="view"><canvas id="canvas"></canvas></main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
